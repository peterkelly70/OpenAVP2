name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore OpenAvP2.sln

      - name: Build
        run: dotnet build OpenAvP2.sln --configuration Release --no-restore

      # Parser and compatibility tests must pass without a game installation.
      # Tests needing real data skip cleanly (see tests/*/fixtures/README.md).
      - name: Test
        run: dotnet test OpenAvP2.sln --configuration Release --no-build --verbosity normal

  provenance:
    name: provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No original AvP2 game data may enter the repository (TDD section 24).
      - name: Reject committed game assets
        run: |
          matches=$(git ls-files | grep -Ei '\.(rez|dat|dtx|abc)$' || true)
          if [ -n "$matches" ]; then
            echo "Committed game data detected:"
            echo "$matches"
            exit 1
          fi
          echo "No game data committed."
